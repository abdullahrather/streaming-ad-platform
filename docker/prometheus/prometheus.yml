# Scrapes the API every 15 seconds and checks the alert rules.
# The bearer token matches METRICS_TOKEN in docker-compose.monitoring.yml. It's for this
# local stack only; a real deployment sets its own in both places.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization:
      credentials: local-metrics-token
    static_configs:
      - targets: ['api:3000']
