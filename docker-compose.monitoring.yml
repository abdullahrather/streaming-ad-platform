# Adds monitoring and backups to the stack in docker-compose.yml. One command:
#
#   npm run stack
#   (docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up --build)
#
# Grafana:      http://localhost:3001  (admin / admin, or GRAFANA_PASSWORD)
# Prometheus:   http://localhost:9090
# Alertmanager: http://localhost:9093
#
# The tokens below are for this local stack only. A real deployment sets its own, here
# and in docker/prometheus/prometheus.yml and docker/alertmanager/alertmanager.yml.
services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      LOKI_URL: http://loki:3100
      METRICS_TOKEN: local-metrics-token
      ALERT_WEBHOOK_TOKEN: local-alert-token
      BACKUP_DIR: /app/.data/backups
      # Demo traffic, so the dashboards have something to show.
      SIMULATE_TRAFFIC: always
    volumes:
      - backups:/app/.data/backups:ro
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  # Backs up the database and proves the backup restores, now and then every day.
  backup:
    build:
      context: .
      target: builder
    container_name: campaign_analytics_backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:secret@db:5432/campaign_analytics?schema=public
      BACKUP_DIR: /app/.data/backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backups:/app/.data/backups
    depends_on:
      api:
        condition: service_started
    # Waits a minute for the API to migrate and seed the database first.
    command: sh -c 'sleep 60; while true; do node scripts/restore-drill.mjs; sleep "$$BACKUP_INTERVAL_SECONDS"; done'

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: campaign_analytics_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: campaign_analytics_alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./docker/alertmanager:/etc/alertmanager:ro
    ports:
      - '127.0.0.1:9093:9093'

  grafana:
    image: grafana/grafana:12.0.2
    container_name: campaign_analytics_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/platform.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.5.0
    container_name: campaign_analytics_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  tempo:
    image: grafana/tempo:2.8.1
    container_name: campaign_analytics_tempo
    restart: unless-stopped
    # Writes traces to the volume, which belongs to root when Docker creates it.
    user: root
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./docker/tempo:/etc/tempo:ro
      - tempo_data:/var/tempo

volumes:
  backups:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
